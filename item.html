<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GrillMaster POS System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="assests/css/style_item.css">
</head>

<body>

    <!-- Nav bar - icon bar vertical -->
    <div class="container-fluid">
        <div class="row display_area">
            <div class="navigation_vertical">

                <img src="assests/img/Logo.png" alt="" class="logo_img">
                <a href="index.html"><img src="assests/img/icon_home.png" alt="" width="30px" height="30px"></a>
                <a href="dashboard.html"><img src="assests/img/icon dashboard.png" alt="" width="30px"
                        height="30px"></a>
                <a href="order.html"><img src="assests/img/icon_order.png" alt="" width="30px" height="30px"></a>
                <a href="customer.html"><img src="assests/img/icon_customer.png" alt="" width="30px" height="30px"></a>
                <a class="active" href="item.html"><img src="assests/img/icon_product.png" alt="" width="30px"
                        height="30px"></a>
                <a href="#"><img src="assests/img/icon_settings.png" alt="" width="30px" height="30px"
                        style="margin-top: 180px;"></a>
                <a href="index.html"><img src="assests/img/icon_logout.png" alt="" width="30px" height="30px"></a>

            </div>

            <div class="main_area">
                <div class="row ">
                    <div class="col-6">
                        <h5 style="margin-top: 32px;">WELCOME GRILLMASTER</h5>
                    </div>
                    <div class="col-6" style="margin-top: 15px;" id="date_time_area">

                        <label for="" style="font-size: 14px;" id="date_time">Monday, November 24 2025 </label>
                        <!-- <label for="" style="font-size: 14px;">20:23:00</label> -->
                        <button class="btn" type="button" style="height: 40px; margin-top: 0px; margin-left: 10px;"
                            id="button_profile"><img src="assests/img/icon_profile.png" alt="" width="35px"></button>
                        <h6 style="margin-top: 12px;" id="profile_name">Hello</h6>

                    </div>

                </div>

                <div style="margin-top: 20px;">
                    <h6>Item Management</h6>
                </div>

                <div
                    style="display: flex; align-items: center;justify-content: end; margin-top: 15px; margin-bottom: 25px;">
                    <div class="input-group mb-3" style="width: 25%; height: 20px;">
                        <input type="text" class="form-control" placeholder="Search Item" aria-label="Search"
                            aria-describedby="button-addon2" id="txt_search">
                        <button class="btn" type="button" id="button-addon2"><img src="assests/img/icon_search.png"
                                alt="" width="25px"></button>
                    </div>
                    <button class="btn" type="button" style="height: 40px; margin-left: 5px;" id="button_filter"><img
                            src="assests/img/icon_filter.png" alt="" width="25px"></button>

                    <button class="btn" type="button" style="height: 40px; margin-left: 5px;" id="button_refresh"><img
                            src="assests/img/icon_refresh.png" alt="" width="25px"></button>
                </div>

                <div id="item_table">
                    <div class="table_header">
                        <div class="label_div">
                            <label for="Item ID" class="lbl_id" style="flex-basis: 10%;">Item ID</label>
                            <label for="Item Name" class="lbl_name" style="flex-basis: 25%;">Item Name</label>
                            <label for="Category" class="lbl_category" style="flex-basis: 15%;">Category</label>
                            <label for="Size" class="lbl_size" style="flex-basis: 15%;">Size</label>
                            <label for="Price" class="lbl_price" style="flex-basis: 15%;">Price</label>
                            <label for="Discount" class="lbl_discount" style="flex-basis: 10%;">Discounts</label>
                            <label for="Stock" class="lbl_stock" style="flex-basis: 10%;">Stock</label>
                        </div>
                        <div class="button_div">
                            <button class="btn" id="button_add_item"><img src="assests/img/icon_add_new.png" alt=""
                                    width="25px"></button>
                        </div>
                    </div>

                    <div id="table_data_div">
                        
                        <!-- Dynamically add table rows here -->

                    </div>


                </div>

            </div>


        </div>

    </div>


    <!-- Dialog box to edit/update item details -->
    <dialog id="dialog_box_edit_item">
        <h2 style="font-size: 20px; text-align: center; padding-bottom: 10px;">Update Item Details</h2>
        <form method="dialog">
            <label for="name" id="dlbl_name_edit">Name :</label>
            <input type="text" id="dtxt_name_edit" name="name" required
                style="border-radius:8px; border: none; background-color: #F8F8F8;"><br><br>

            <label for="category" id="dlbl_category_edit">Category :</label>
            <input type="text" id="dtxt_category_edit" name="category" required
                style="border-radius:8px; border: none; background-color: #F8F8F8;"><br><br>

            <label for="size" id="dlbl_size_edit">Size :</label>
            <input type="text" id="dtxt_size_edit" name="size" required
                style="border-radius:8px; border: none; background-color: #F8F8F8;"><br><br>

            <label for="price" id="dlbl_price_edit">Price :</label>
            <input type="text" id="dtxt_price_edit" name="price" required
                style="border-radius:8px; border: none; background-color: #F8F8F8;"><br><br>

            <label for="discount" id="dlbl_discount_edit">Discounts :</label>
            <input type="text" id="dtxt_discount_edit" name="discount" required
                style="border-radius:8px; border: none; background-color: #F8F8F8;"><br><br>

            <label for="stock" id="dlbl_stock_edit">Stock :</label>
            <input type="text" id="dtxt_stock_edit" name="stock" required
                style="border-radius:8px; border: none; background-color: #F8F8F8;"><br><br>

            <!-- The button with value="cancel" automatically closes the dialog -->
            <div style="display: flex; justify-content: end;">
                <button value="cancel" id="cancel_button_edit">Cancel</button>
                <button id="update_button" type="submit">Update</button>
            </div>

        </form>
    </dialog>

    <!-- ------------------------------------------ -->

    <!-- Dialog box to collect item details -->

    <dialog id="dialog_box_item">
        <h2 style="font-size: 20px; text-align: center; padding-bottom: 10px;">Enter Item Details</h2>
        <form method="dialog">
            <label for="name" id="dlbl_name">Name :</label>
            <input type="text" id="dtxt_name" name="name" required
                style="border-radius:8px; border: none; background-color: #F8F8F8;"><br><br>

            <label for="category" id="dlbl_category">Category :</label>
            <input type="text" id="dtxt_category" name="category" required
                style="border-radius:8px; border: none; background-color: #F8F8F8;"><br><br>

            <label for="size" id="dlbl_size">Size :</label>
            <input type="text" id="dtxt_size" name="size" required
                style="border-radius:8px; border: none; background-color: #F8F8F8;"><br><br>

            <label for="price" id="dlbl_price">Price :</label>
            <input type="text" id="dtxt_price" name="price" required
                style="border-radius:8px; border: none; background-color: #F8F8F8;"><br><br>

            <label for="discount" id="dlbl_discount">Discounts :</label>
            <input type="text" id="dtxt_discount" name="discount" required
                style="border-radius:8px; border: none; background-color: #F8F8F8;"><br><br>

            <label for="stock" id="dlbl_stock">Stock :</label>
            <input type="text" id="dtxt_stock" name="stock" required
                style="border-radius:8px; border: none; background-color: #F8F8F8;"><br><br>

            <!-- The button with value="cancel" automatically closes the dialog -->
            <div style="display: flex; justify-content: end;">
                <button value="cancel" id="cancel_button">Cancel</button>
                <button id="save_button" type="submit">Save</button>
            </div>

        </form>
    </dialog>

    <!-- ------------------------------------------ -->

    <!-- Dialog box for delete confirmation -->

    <dialog id="dialog_box_delete">
        <form method="dialog">
            <label for="name" id="confirm_msg">Do you want to delete the selected record?</label><br><br>

            <!-- The button with value="cancel" automatically closes the dialog -->
            <div style="display: flex; justify-content: end;">
                <button value="No" id="no_button">No</button>
                <button id="yes_button" type="submit">Yes</button>
            </div>

        </form>
    </dialog>


    <!-- ------------------------------------------ -->

    <!-- -----------------modal box for filter-------------- -->

    <div class="modal" tabindex="-1" role="dialog" id="dialog_box_filter">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Select Filters</h5>
            </div>
            <div class="modal-body">
                <div class="filters">
                    <label><input type="checkbox" id="filter_category" value="Category" onchange="filterItems()"> Category</label>
                    <label><input type="checkbox" id="filter_price" value="Price" onchange="filterItems()"> Price</label>
                    <label><input type="checkbox" id="filter_stock" value="Stock" onchange="filterItems()"> Stock</label>
                    <label><input type="checkbox" id="filter_discount" value="Discount" onchange="filterItems()"> Discounted Items</label>
                </div>
                <div id="category_div" style="display: none;">
                    <select class="form-select" aria-label="Default select example" style="width: 50%;" id="category_dd">
                        <option value="0" selected>Select Category</option>
                        <option value="Burger">Burger</option>
                        <option value="Submarine">Submarine</option>
                        <option value="Pasta">Pasta</option>
                        <option value="Fries">Fries</option>
                        <option value="Chicken">Chicken</option>
                        <option value="Beverages">Beverages</option>
                    </select>
                </div>
                <div id="price_div" style="display: none;">
                    <label for="title_price">Price Range : </label>
                    <label for="price_min">Min : </label>
                    <input type="number" id="price_min" name="price_min" min="100" max="5000" value="100">
                    <label for="price_max">Max : </label>
                    <input type="number" id="price_max" name="price_max" min="100" max="5000" value="5000">
                </div>
                <div id="stock_div" style="display: none;">
                    <label for="title_stock">Stock Range : </label>
                    <label for="price_min">Min : </label>
                    <input type="number" id="stock_min" name="stock_min" min="0" max="500" value="0">
                    <label for="price_max">Max : </label>
                    <input type="number" id="stock_max" name="stock_max" min="0" max="500" value="500">
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-primary" id="button_apply_filter">Apply</button>
                <button type="button" class="btn btn-secondary" data-dismiss="modal" id="button_close_filter">Close</button>
            </div>
            </div>
        </div>
    </div>


    <!-- <h1>Welcome to DrillMaster Burger Shop</h1> -->



    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="assests/js/app_item.js"></script>
</body>

</html>

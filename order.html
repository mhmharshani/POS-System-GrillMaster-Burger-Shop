<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GrillMaster POS System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="assests/css/style_order.css">
</head>

<body>

    <!-- Nav bar - icon bar vertical -->
    <div class="container-fluid">
        <div class="row display_area">
            <div class="navigation_vertical">

                <img src="assests/img/Logo.png" alt="" class="logo_img">
                <a href="index.html"><img src="assests/img/icon_home.png" alt="" width="30px" height="30px"></a>
                <a href="dashboard.html"><img src="assests/img/icon dashboard.png" alt="" width="30px"
                        height="30px"></a>
                <a class="active" href="order.html"><img src="assests/img/icon_order.png" alt="" width="30px"
                        height="30px"></a>
                <a href="customer.html"><img src="assests/img/icon_customer_2.png" alt="" width="30px" height="30px"></a>
                <a href="item.html"><img src="assests/img/icon_product.png" alt="" width="30px" height="30px"></a>
                <a href="#"><img src="assests/img/icon_settings.png" alt="" width="30px" height="30px"
                        style="margin-top: 180px;"></a>
                <a href="index.html"><img src="assests/img/icon_logout.png" alt="" width="30px" height="30px"></a>

            </div>

            <div class="main_area">
                <div class="date_time_area">
                    <div>
                        <h5 style="margin-top: 32px;">WELCOME GRILLMASTER</h5>
                    </div>
                    <div style="margin-top: 15px;">

                        <label for="" style="font-size: 14px;" id="date_time">Monday, November 24 2025 </label>
                        <!-- <label for="" style="font-size: 14px;">20:23:00</label> -->
                        <button class="btn" type="button" style="margin-top: 5px; margin-left: 10px;"
                            id="button_profile"><img src="assests/img/icon_profile.png" alt="" width="35px"></button>

                    </div>

                </div>

                <div style="margin-top: 20px;">
                    <h6>Order Management</h6>
                </div>

                <div
                    style="display: flex; align-items: center;justify-content: end; margin-top: 15px; margin-bottom: 25px;">
                    <div class="input-group mb-3" style="width: 25%; height: 20px;">
                        <input type="text" class="form-control" placeholder="Search Order" aria-label="Search"
                            aria-describedby="button-addon2" id="txt_search">
                        <button class="btn" type="button" id="button-addon2"><img src="assests/img/icon_search.png"
                                alt="" width="25px"></button>
                    </div>
                    <button class="btn" type="button" style="height: 40px; margin-left: 5px;" id="button_filter"><img
                            src="assests/img/icon_filter.png" alt="" width="25px"></button>
                    <button class="btn" type="button" style="height: 40px; margin-left: 5px;" id="button_refresh"><img
                            src="assests/img/icon_refresh.png" alt="" width="25px"></button>
                </div>

                <div id="order_table">
                    <div class="table_header">
                        <div class="label_div">
                            <label for="Order ID" class="lbl_id" style="flex-basis: 20%;">Order ID</label>
                            <label for="Customer ID" class="lbl_cust_id" style="flex-basis: 20%;">Customer ID</label>
                            <label for="Cart ID" class="lbl_cart_id" style="flex-basis: 20%;">Cart ID</label>
                            <label for="Total" class="lbl_total" style="flex-basis: 20%;">Total</label>
                            <label for="Status" class="lbl_status" style="flex-basis: 20%;">Status</label>
                        </div>
                        <div class="button_div">
                            <button class="btn"><img src="assests/img/icon_add_new.png" alt="" width="25px" id="button_add_order"></button>
                        </div>
                    </div>
                    <div id="table_data_div">
                        <!-- <input type="text" id="txt_id" value=${order.id} readonly> -->
                         <!-- Dynamically add table rows here -->
                    </div>
                    
                </div>

            </div>


        </div>

    </div>

    <!-- Dialog box for confirmation to place a order -->

    <dialog id="dialog_box_add" class="dialog_box_modal">
        <form method="dialog">
            <label for="name" id="confirm_msg">Do you want to place a order?</label><br><br>

            <!-- The button with value="cancel" automatically closes the dialog -->
            <div style="display: flex; justify-content: end;">
                <button value="No" id="no_add_button">No</button>
                <button id="yes_add_button" type="submit" onclick="window.location.href='dashboard.html'">Yes</button>
            </div>

        </form>
    </dialog>

    <!-- ------------------------------------------ -->

    <!-- Dialog box for delete confirmation -->

    <dialog id="dialog_box_delete" class="dialog_box_modal">
        <form method="dialog">
            <label for="name" id="confirm_msg">Do you want to cancel/delete the order?</label><br><br>

            <!-- The button with value="cancel" automatically closes the dialog -->
            <div style="display: flex; justify-content: end;">
                <button value="No" id="no_delete_button">No</button>
                <button id="yes_delete_button" type="submit">Yes</button>
            </div>

        </form>
    </dialog>

    <!-- ------------------------------------------ -->

    <!-- Dialog box to update order details -->
    <dialog id="dialog_box_edit_order" class="dialog_box_modal">
        <h2 style="font-size: 20px; text-align: center; padding-bottom: 10px;">Update Order Details</h2>
        <form method="dialog">
            <label for="id" id="dlbl_id_edit">Order ID : </label><br>
            <input type="text" id="dtxt_id_edit" name="id" required
                style="border-radius:8px; border: none; background-color: #F8F8F8;" readonly><br><br>

            <label for="status" id="dlbl_status_edit">Status :</label><br>
            <input type="text" id="dtxt_status_edit" name="Status" required
                style="border-radius:8px; border: none; background-color: #F8F8F8;"><br><br>

            <!-- The button with value="cancel" automatically closes the dialog -->
            <div style="display: flex; justify-content: end;">
                <button value="cancel" id="cancel_button_edit">Cancel</button>
                <button id="update_button" type="submit">Update</button>
            </div>

        </form>
    </dialog>

    <!-- ------------------------------------------ -->

    <!-- -----------------modal box for filter-------------- -->

    <div class="modal" tabindex="-1" role="dialog" id="dialog_box_filter">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Select Filters</h5>
                </div>
                <div class="modal-body">
                    <div class="filters">
                        <label><input type="checkbox" id="filter_status" value="Status" onchange="filterOrders()"> Status</label>
                        <label><input type="checkbox" id="filter_total" value="Total" onchange="filterOrders()"> Bill Amount</label>
                        <label><input type="checkbox" id="filter_deleted" value="Deleted" onchange="filterOrders()"> Deleted Orders</label>
                    </div>
                    <div id="status_div" style="display: none;">
                        <select class="form-select" aria-label="Default select example" style="width: 50%;" id="status_dd">
                            <option value="0" selected>Select Status</option>
                            <option value="New Order">New Order</option>
                            <option value="In Preparation">In Preparaton</option>
                            <option value="Ready to Serve">Ready to Serve</option>
                            <option value="Served">Served</option>
                            <option value="Canceled">Canceled</option>
                        </select>
                    </div>
                    <div id="total_div" style="display: none;">
                        <label for="title_total">Bill Amount Range : </label>
                        <label for="total_min">Min : </label>
                        <input type="number" id="total_min" name="total_min" min="100" max="50000" value="100">
                        <label for="total_max">Max : </label>
                        <input type="number" id="total_max" name="total_max" min="100" max="50000" value="50000">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-primary" id="button_apply_filter">Apply</button>
                    <button type="button" class="btn btn-secondary" data-dismiss="modal" id="button_close_filter">Close</button>
                </div>
            </div>
        </div>
    </div>

   
    <!-- <h1>Welcome to DrillMaster Burger Shop</h1> -->



    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="assests/js/app_order.js"></script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GrillMaster POS System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="assests/css/style_dashboard.css">
</head>

<body>

    <!-- Nav bar - icon bar vertical -->
    <div class="container-fluid">
        <div class="row display_area">
            <div class="navigation_vertical">

                <img src="assests/img/Logo.png" alt="" class="logo_img">
                <a href="index.html"><img src="assests/img/icon_home.png" alt="" width="30px" height="30px"></a>
                <a class="active" href="dashboard.html"><img src="assests/img/icon dashboard.png" alt="" width="30px" height="30px"></a>
                <a href="order.html"><img src="assests/img/icon_order.png" alt="" width="30px" height="30px"></a>
                <a href="customer.html"><img src="assests/img/icon_customer.png" alt="" width="30px" height="30px"></a>
                <a href="item.html"><img src="assests/img/icon_product.png" alt="" width="30px" height="30px"></a>
                <a href="#"><img src="assests/img/icon_settings.png" alt="" width="30px" height="30px"
                        style="margin-top: 180px;"></a>
                <a href="index.html"><img src="assests/img/icon_logout.png" alt="" width="30px" height="30px"></a>

            </div>

            <div class="main_area">
                <div class="row">
                    <div class="col-6">
                        <h5 style="margin-top: 32px;">WELCOME GRILLMASTER</h5>
                    </div>
                    <div class="col-6 input_area">
                        <div class="input-group mb-3" style="width: 60%; height: 20px; margin-top: 32px;">
                            <input type="text" class="form-control" placeholder="Search Menu by Name" aria-label="Search" aria-describedby="button-addon2" id="txt_search">
                            <button class="btn" type="button" id="button-addon2"><img src="assests/img/icon_search.png" alt="" width="25px"></button>

                        </div>
                        <button class="btn" type="button" style="height: 40px; margin-top: 32px; margin-left: 10px;"
                            id="button_filter"><img src="assests/img/icon_filter.png" alt="" width="25px"></button>

                        <button class="btn" type="button" style="height: 40px; margin-top: 32px; margin-left: 10px;"
                            id="button_profile"><img src="assests/img/icon_profile.png" alt="" width="30px"></button>

                    </div>


                </div>

                <div style="display: flex; align-items: center;justify-content: space-between; margin-top: 20px;">
                    <h6>Order Queue</h6>
                    <button class="btn" type="button" style="height: 40px;font-size: 15px;" id="button_sea_all">See
                        All</button>
                </div>

                <div class="row row-cols-1 row-cols-md-4 g-4" id="order_queue_container">
                    
                    <!-- Dynamically loading order queue cards here. -->

                </div>



                <div style="display: flex; align-items: center;justify-content: space-between; margin-top: 15px;">
                    <h6>Menu</h6>
                    <button class="btn" type="button" style="height: 40px;font-size: 15px;" id="button_sea_all">See
                        All</button>
                </div>

                <!-- category buttons -->

                <div class="btn-toolbar" role="toolbar" aria-label="Toolbar with button groups">
                    <div class="btn-group me-2" role="group" aria-label="First group">
                        <button type="button" class="btn button_category_1" id="button_burger">Burgers</button>
                        <button type="button" class="btn button_category_1" id="button_submarine">Submarines</button>
                        <button type="button" class="btn button_category_1" id="button_pasta">Pasta</button>
                    </div>
                    <div class="btn-group me-2" role="group" aria-label="Second group">
                        <button type="button" class="btn button_category_2" id="button_fries">Fries</button>
                        <button type="button" class="btn button_category_2" id="button_chicken">Chicken</button>
                    </div>
                    <div class="btn-group" role="group" aria-label="Third group">
                        <button type="button" class="btn button_category_3" id="button_beverage">Beverages</button>
                    </div>
                </div>
                <!-- ------------------------ -->

                <!-- Menu cards -->
                <div class="row row-cols-1 row-cols-md-3 g-4 mt-1 mb-4" id="item_card_container">
                    
                    <!-- Cards are dynamically loaded here. -->
                     
                </div>
                <!-- ---------------------- -->

            </div>
            <div class="order_details">
                <div style="display: flex; align-items: center;justify-content: space-between;">
                    <h6 style="margin-top: 32px;">Current Order</h6>
                    <button class="btn" type="button" style="height: 40px; margin-top: 32px;" id="button_profile"><img
                            src="assests/img/icon_cart.png" alt="" width="25px"></button>
                </div>

                <div class="card w-100 mb-2 mt-2 " style="font-size: 13px; background-color: #EDF0F5;">
                    <div class="card-body">
                        <div style="display: flex; justify-content: space-between;">
                            <label for="">Order ID </label>
                            <label for="" style="padding-bottom: 8px;" id="txt_order_id">ODR0001</label>
                        </div>
                        <div style="display: flex; justify-content: space-between;">
                            <label for="">Cust. Name </label>
                            <label for="" id="current_customer">Walk-in Customer</label>
                        </div>
                        <div style="display: flex; justify-content: end; gap: 5px; margin-top: 5px;">
                            <button class="btn" id="button_find_customer" ><img src="assests/img/icon_search.png" alt="" width="20px"></button>
                            <a href="customer.html" class="btn" id="button_new_customer"><img src="assests/img/icon_add_new.png" alt="" width="20px"></a>
                        </div>

                    </div>
                </div>

                <h6 class="mt-3">List Item(2)</h6>

                <div class="overflow-auto mb-3 mt-1" style="height: 35vh; min-height: 35vh; font-size: 14px; background-color: #EDF0F5; border-radius: 10px;">
                    <ol class="list-group list-group-numbered" id="cart_item" style="list-style: none;">
                        <!-- Dynamically load cart items -->
                        
                    </ol>
                </div>


                <div class="card w-100 mb-2 mt-2 " style="font-size: 13px; background-color: #EDF0F5;">
                    <div class="card-body">
                        <div style="display: flex; justify-content: space-between;">
                            <label for="">Sub Total </label>
                            <label for="" style="padding-bottom: 8px;" id="txt_sub_total">2500.00</label>
                        </div>
                        <div style="display: flex; justify-content: space-between;">
                            <label for="">Discounts </label>
                            <label for="" style="padding-bottom: 8px;" id="txt_discount">0.00</label>
                        </div>
                        <div style="display: flex; justify-content: space-between;">
                            <label for=""><b>Grand Total</b> </label>
                            <label for="" id="txt_grand_total"><b>2500.00</b></label>
                        </div>

                    </div>
                </div>
                <div id="button_payment">
                    <button class="btn" id="button_place_order">Place Order</button>
                </div>  

            </div>

        </div>

    </div>


    <!-- Dialog box to collect customer details -->

    <dialog id="dialog_box_find_customer">

        <form method="dialog">
         
            <label for="phone_no" id="dlbl_phone">Phone Number :</label>
            <input type="phone_number" id="dtxt_phone" name="phone_number" required style="border-radius:8px; border: none; background-color: #F8F8F8;"><br><br>
            
            <!-- The button with value="cancel" automatically closes the dialog -->
             <div style="display: flex; justify-content: end; gap: 5px;">
                <button value="cancel" id="cancel_button">Cancel</button>
                <button id="search_button" type="submit">Search</button>
             </div>
            
        </form>
    </dialog>


    <!-- ------------------------------------------ -->



    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="assests/js/app_dashboard.js"></script>
</body>

</html>

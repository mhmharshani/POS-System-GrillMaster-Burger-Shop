<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DrillMaster POS System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="assests/css/style_customer.css">
</head>

<body>

    <!-- Nav bar - icon bar vertical -->
    <div class="container-fluid">
        <div class="row display_area">
            <div class="navigation_vertical">

                <img src="assests/img/Logo.png" alt="" class="logo_img">
                <a href="index.html"><img src="assests/img/icon_home.png" alt="" width="30px" height="30px"></a>
                <a href="dashboard.html"><img src="assests/img/icon dashboard.png" alt="" width="30px" height="30px"></a>
                <a href="order.html"><img src="assests/img/icon_order.png" alt="" width="30px" height="30px"></a>
                <a class="active" href="customer.html"><img src="assests/img/icon_customer.png" alt="" width="30px" height="30px"></a>
                <a href="item.html"><img src="assests/img/icon_product.png" alt="" width="30px" height="30px"></a>
                <a href="#"><img src="assests/img/icon_settings.png" alt="" width="30px" height="30px"
                        style="margin-top: 180px;"></a>
                <a href="index.html"><img src="assests/img/icon_logout.png" alt="" width="30px" height="30px"></a>

            </div>

            <div class="main_area">
                <div class="date_time_area">
                    <div>
                        <h5 style="margin-top: 32px;">WELCOME GRILLMASTER</h5>
                    </div>
                    <div style="margin-top: 15px;">

                        <label for="" style="font-size: 14px;" id="date_time">Monday, November 24 2025 </label>
                        <!-- <label for="" style="font-size: 14px;">20:23:00</label> -->
                        <button class="btn" type="button" style="margin-top: 5px; margin-left: 10px;"
                            id="button_profile"><img src="assests/img/icon_profile.png" alt="" width="35px"></button>

                    </div>

                </div>

                <div style="margin-top: 20px;">
                    <h6>Customer Management</h6>
                </div>

                <div style="display: flex; align-items: center;justify-content: end; margin-top: 15px; margin-bottom: 25px;">
                    <div class="input-group mb-3" style="width: 25%; height: 20px;">
                        <input type="text" class="form-control" placeholder="Search Customer" aria-label="Search" aria-describedby="button-addon2" id="txt_search">
                        <button class="btn" type="button" id="button-addon2"><img src="assests/img/icon_search.png" alt="" width="25px"></button>
                    </div>
                    <button class="btn" type="button" style="height: 40px; margin-left: 5px;" id="button_filter"><img src="assests/img/icon_filter.png" alt="" width="25px"></button>
                </div>

                <div id="customer_table">
                    <div class="table_header">
                        <div class="label_div">
                            <label for="Customer ID"  class="lbl_id" style="flex-basis: 33%;">Customer ID</label>
                            <label for="Customer Name" class="lbl_name" style="flex-basis: 33%;">Customer Name</label>
                            <label for="Phone Number" class="lbl_phone" style="flex-basis: 33%;">Phone Number</label>
                        </div>
                        <div class="button_div">
                            <button class="btn" id="button_add_customer"><img src="assests/img/icon_add_user.png" alt="" width="25px"></button>
                        </div>
                    </div>
                    <div id="table_data_div">
                         <!-- Dynamically add table rows here -->
                    </div>
                        
                </div>

            </div>


        </div>

    </div>

    <!-- Dialog box to collect customer details -->

    <dialog id="dialog_box_customer">
        <h2 style="font-size: 20px; text-align: center; padding-bottom: 10px;">Enter Customer Details</h2>
        <form method="dialog">
            <label for="name" id="dlbl_name">Name         :</label>
            <input type="text" id="dtxt_name" name="name" required style="border-radius:8px; border: none; background-color: #F8F8F8;"><br><br>
            
            <label for="phone_no" id="dlbl_phone">Phone Number :</label>
            <input type="phone_number" id="dtxt_phone" name="phonr_number" required style="border-radius:8px; border: none; background-color: #F8F8F8;"><br><br>
            
            <!-- The button with value="cancel" automatically closes the dialog -->
             <div style="display: flex; justify-content: end;">
                <button value="cancel" id="cancel_button">Cancel</button>
                <button id="save_button" type="submit">Save</button>
             </div>
            
        </form>
    </dialog>


    <!-- ------------------------------------------ -->



    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="assests/js/app_customer.js"></script>
</body>

</html>

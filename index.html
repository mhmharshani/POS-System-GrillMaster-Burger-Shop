<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GrillMaster POS System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="assests/css/style.css">
</head>

<body>

    <div class="container-fluid">
        <div class="row home_page">
            <div class="display_area">
                <div id="left_div">
                    <img src="assests/img/Logo.png" alt="" width="120px">
                    <h5 style="margin-left: 20px; font-weight: bold; font-size: 30px; color: #383F53;">WELCOME
                        GRILLMASTER</h5>
                    <p
                        style="text-align: right; margin-right: 34px; font-weight: bold; font-size: 18px; margin-top: 0px; color: #383F53;">
                        The Future Flavours</p>

                    <div class="tag_line">
                        <p>ALL IN ONE BURGER SHOP IN YOUR TOWN</p>
                    </div>

                    <h6 class="join_us">JOIN US</h6>

                </div>

            </div>
            <div class="form_area">
                <div id="right_div">
                    <h1 class="txt_welcome">WELCOME</h1>
                    <h5 class="shop_name">GRILLMASTER BURGER SHOP</h5>

                    <form class="form_div">
                        <div class="form-group row " style="margin-top: 30px;">
                            <div class="col-sm-3"></div>
                            <label for="inputUsername" class="col-sm-2 col-form-label input_name">User Name</label>
                            <div class="col-sm-5">
                                <input type="text" class="form-control" id="input_username" placeholder="User name">
                            </div>
                            <div class="col-sm-2"></div>

                        </div>
                        <div class="form-group row" style="margin-top: 20px;">
                            <div class="col-sm-3"></div>
                            <label for="inputEmail3" class="col-sm-2 col-form-label input_name">Email</label>
                            <div class="col-sm-5">
                                <input type="email" class="form-control" id="input_email" placeholder="Email">
                            </div>
                            <div class="col-sm-2"></div>
                        </div>
                        <div class="form-group row" style="margin-top: 20px;">
                            <div class="col-sm-3"></div>
                            <label for="inputPassword3" class="col-sm-2 col-form-label input_name">Password</label>
                            <div class="col-sm-5">
                                <input type="password" class="form-control" id="input_password" placeholder="Password">
                            </div>
                        </div>
                        
                        
                        <div class="form-group row " style="margin-top: 20px;">
                            <div class="col-sm-10 button_div" style="display: flex; justify-content: end;">
                                <button type="button" class="btn" style="margin-right: 10px;" id="button_login">LOG IN</button>
                                <button type="button" class="btn" id="button_signup">SIGN UP</button>
                            </div>
                        </div>
                    </form>

                    <div class="nav_dashboard" style="display: flex; justify-content: end;">
                        <a href="dashboard.html" class="btn">>></a>
                    </div>
                </div>


            </div>
        </div>
    </div>



    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="assests/js/app.js"></script>
</body>

</html>

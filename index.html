<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DrillMaster POS System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="assests/css/style.css">
</head>

<body>

    <!-- Nav bar - icon bar vertical -->
    <div class="container-fluid">
        <div class="row display_area">
            <div class="navigation_vertical">
                
                <img src="assests/img/Logo.png" alt="" class="logo_img">
                <a class="active" href="#"><img src="assests/img/icon_home.png" alt="" width="30px" height="30px"></a>
                <a href="#"><img src="assests/img/icon dashboard.png" alt="" width="30px" height="30px"></a>
                <a href="#"><img src="assests/img/icon_order.png" alt="" width="30px" height="30px"></a>
                <a href="#"><img src="assests/img/icon_customer.png" alt="" width="30px" height="30px"></a>
                <a href="#"><img src="assests/img/icon_product.png" alt="" width="30px" height="30px"></a>
                <a href="#"><img src="assests/img/icon_settings.png" alt="" width="30px" height="30px" style="margin-top: 180px;"></a>
                <a href="#"><img src="assests/img/icon_logout.png" alt="" width="30px" height="30px"></a>
                
            </div>

            <div class="main_area">
                <div class="row">
                    <div class="col-6">
                        <h5 style="margin-top: 32px;">WELCOME DRILLMASTER</h5>
                    </div>
                    <div class="col-6 input_area">
                        <div class="input-group mb-3"  style="width: 60%; height: 20px; margin-top: 32px;">
                            <input type="text" class="form-control" placeholder="Recipient’s username" aria-label="Recipient’s username" aria-describedby="button-addon2" id="txt_search">
                            <button class="btn" type="button" id="button-addon2"><img src="assests/img/icon_search.png" alt="" width="25px"></button>
                        
                        </div>
                        <button class="btn" type="button" style="height: 40px; margin-top: 32px; margin-left: 10px;" id="button_filter"><img src="assests/img/icon_filter.png" alt="" width="25px"></button>

                        <button class="btn" type="button" style="height: 40px; margin-top: 32px; margin-left: 10px;" id="button_profile"><img src="assests/img/icon_profile.png" alt="" width="30px"></button>

                    </div>
                    
                    
                </div>
                
            </div>
            <div class="order_details">
                <div style="display: flex; align-items: center;justify-content: space-between;">
                    <h5 style="margin-top: 32px;">Current Order</h5>
                    <button class="btn" type="button" style="height: 40px; margin-top: 32px;" id="button_profile"><img src="assests/img/icon_cart.png" alt="" width="25px"></button>
                </div>
                

            </div>

        </div>
        
    </div>
    

    

    <!-- <h1>Welcome to DrillMaster Burger Shop</h1> -->



    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="assests/js/app.js"></script>
</body>

</html>
